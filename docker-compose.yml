version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    restart: always

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE_URL=http://localhost:5000/api/v1
        - VITE_GOOGLE_CLIENT_ID=your_google_client_id_here
    ports:
      - "80:80"
    restart: always